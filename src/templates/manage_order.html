<!DOCTYPE html>
<html lang="en">
<head>
{{template "head"}}
</head>
<body>

{{template "header" ""}}

<main class="page">
    <div class="page-head">
        <h2>Managing Order</h2>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr><th class="num">Order ID</th><th>Item</th><th class="num">Quantity</th><th class="num">Price</th><th>Location</th><th>Contract To</th></tr>
            </thead>
            <tbody>
                <tr>
                    <td class="num muted">{{.InternalIdCounter}}</td>
                    <td>{{.TypeName}}</td>
                    <td class="num">{{commaInt .Quantity}}</td>
                    <td class="num">{{commaFloat .Price}} <span class="unit">ISK</span></td>
                    <td>{{.Location}}</td>
                    <td>{{.ContractTo}}</td>
                </tr>
            </tbody>
        </table>
    </div>

    <form id="delete-order-form" action="/manage-order/delete-order" method="POST">
        <input type="hidden" name="order-id" value="{{.InternalIdCounter}}">
    </form>

    <form class="card card-narrow form" action="/manage-order/submit-changes" method="POST">
        <h3>Modify Order</h3>
        <p class="muted">Item type cannot be changed.</p>

        <label for="order-quantity">Quantity</label>
        <input type="number" id="order-quantity" min="1" step="1" name="order-quantity" value="{{.Quantity}}">

        <label for="order-price">Price (ISK)</label>
        <input type="text" id="order-price" inputmode="numeric" pattern="[0-9][0-9,]*" title="Whole ISK, e.g. 8,138,285,000" name="order-price" value="{{commaWhole .Price}}">

        <label for="order-location">Location</label>
        <input type="text" id="order-location" maxlength="50" name="order-location" value="{{.Location}}">

        <label for="order-contract-to">Contract To</label>
        <input type="text" id="order-contract-to" maxlength="50" name="order-contract-to" value="{{.ContractTo}}">

        <input type="hidden" name="order-id" value="{{.InternalIdCounter}}">

        <div class="actions">
            <button class="btn btn-primary" type="submit">Submit Changes</button>
            <button class="btn btn-danger" type="submit" form="delete-order-form">Delete Order</button>
            <a class="btn btn-bad" href="/user-orders">Cancel</a>
        </div>
    </form>
</main>

</body>
</html>
