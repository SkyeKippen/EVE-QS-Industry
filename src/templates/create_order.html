<!DOCTYPE html>
<html lang="en">
<head>
{{template "head"}}
</head>
<body>

{{template "header" "order-board"}}

<main class="page">
    <div class="page-head">
        <h2>Create Order</h2>
    </div>

    {{if .InvalidTypeError}}
    <p role="alert" style="color: var(--bad);">Invalid Item Type, please try again.</p>
    {{end}}

    <form class="card form" action="/process-order-creation" method="POST">
        <label for="order-item">Item</label>
        <input type="text" id="order-item" name="order-item" maxlength="50" placeholder="Enter Item name" required>

        <label for="order-quantity">Quantity</label>
        <input type="number" id="order-quantity" name="order-quantity" min="1" step="1" placeholder="Enter Quantity" required>

        <label for="order-price">Price (ISK)</label>
        <input type="text" id="order-price" name="order-price" pattern="\s*[0-9][0-9,]*(\.[0-9]*)?\s*[kKmMbB]?\s*" title="ISK, e.g. 40.34M, 1.5k, 8.5B or 8,138,285,000" placeholder="Enter Price" required>

        <label for="order-location">Location</label>
        <input type="text" id="order-location" name="order-location" maxlength="50" placeholder="Enter Location" required>

        <label for="order-contract-to">Contract To</label>
        <input type="text" id="order-contract-to" name="order-contract-to" maxlength="50" placeholder="Contract To" required>

        <div class="actions">
            <button class="btn btn-primary" type="submit">Create Order</button>
            <a class="btn btn-secondary" href="/order-board">Cancel</a>
        </div>
    </form>
</main>

</body>
</html>
