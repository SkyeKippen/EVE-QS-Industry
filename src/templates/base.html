<!DOCTYPE html>
<html lang="en">
<head>
{{template "head"}}
</head>
<body>

{{template "header" "home"}}

<main class="page">
    <div class="page-head">
        <h2>Welcome</h2>
    </div>

    <section class="card card-narrow">
    {{if .LoggedIn}}
        <p class="muted">Logged in as <strong class="pilot">{{.CharacterName}}</strong></p>
        <div class="actions">
            <a class="btn btn-primary" href="/user-orders">Manage My Orders</a>
            <form action="/auth/logout" method="post">
                <button class="btn btn-secondary" type="submit">Log out</button>
            </form>
        </div>
    {{else}}
        <p class="muted">Sign in with your EVE Online character to use the order board.</p>
        <a class="sso-login" href="/auth/login">
        <img src="https://web.ccpgamescdn.com/eveonlineassets/developers/eve-sso-login-black-small.png"
             alt="Log in with EVE Online" width="195" height="30">
        </a>
    {{end}}
    </section>
</main>

</body>
</html>
