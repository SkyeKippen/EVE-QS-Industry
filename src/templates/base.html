<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MWHI Project</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <header class="banner">
        <h1>MWHI Project</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/blueprints">Blueprints</a>
            <a href="/order-board">Order Board</a>
        </nav>
    </header>

<p>Welcome!</p>

{{if .LoggedIn}}
    <p>Logged in as {{.CharacterName}}</p>
    <form action="/auth/logout" method="post">
        <button class="logout-button" type="submit">Log out</button>
    </form>
    <a href="/user-orders">Manage My Orders</a>
{{else}}
    <a href="/auth/login">
    <img src="https://web.ccpgamescdn.com/eveonlineassets/developers/eve-sso-login-black-small.png"
         alt="Log in with EVE Online" width="195" height="30">
    </a>
{{end}}

</body>
</html>
